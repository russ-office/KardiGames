<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KardiGames Collection</title>
  <style>
    :root{--bg:#f8f9fb;--paper:#ffffff;--ink:#1b1c22;--muted:#6b7280;--line:#e5e7eb;--brand:#ff0033;--radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--shadow-lg:0 12px 36px rgba(0,0,0,.12)}
    *{box-sizing:border-box}html,body{height:100%}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'Noto Sans',sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:1280px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:300px 1fr;gap:24px}
    @media(max-width:900px){.wrap{grid-template-columns:1fr}.aside{order:2}.main{order:1}}
    .aside{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px}
    .logoBox{width:220px;height:220px;border-radius:12px;background:#111;color:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
    .logoBox img{width:100%;height:100%;object-fit:cover}
    h1{margin:8px 0 0 0;font-size:clamp(22px,3.4vw,28px);line-height:1.2;text-align:center;font-weight:800}
    .tag{margin-top:8px;text-align:center;color:var(--muted);line-height:1.5}
    .main{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    @media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.grid{grid-template-columns:1fr}}
    .card{background:transparent;border:none;text-align:left;padding:0;cursor:pointer;font:inherit;color:inherit}
    .thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
    .card:hover .thumb{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#dfe3ec}
    .badge{position:absolute;top:10px;left:10px;z-index:2;background:var(--brand);color:#fff;font-weight:800;font-size:12px;padding:6px 10px;border-radius:999px;box-shadow:0 6px 16px rgba(255,0,51,.25)}
    .title{margin-top:10px;font-weight:800;font-size:18px}
    .dlchip{position:absolute;bottom:10px;right:10px;background:rgba(255,255,255,.95);border:1px solid var(--line);backdrop-filter:blur(4px);display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;color:#1f1f1f;box-shadow:var(--shadow);text-decoration:none}
    .dlchip svg{width:16px;height:16px}.art svg{width:90%;height:auto;display:block}
  </style>
</head>
